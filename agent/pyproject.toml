[project]
name = "rva-agent"
version = "0.1.0"
description = "Dialogue loop, tools and VLA task supervision"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "rva-body-schemas",
  "jinja2>=3.1",
  "loguru>=0.7",
  "opentelemetry-api>=1.36",
  "rva-pydantic",
  "rva-schemas",
  "rva-vla-schemas",
]

[dependency-groups]
dev = [
  "rva-vla-mock",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-body-schemas = {workspace = true}
rva-pydantic = {workspace = true}
rva-schemas = {workspace = true}
rva-vla-schemas = {workspace = true}
rva-vla-mock = {workspace = true}
