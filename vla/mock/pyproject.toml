[project]
name = "rva-vla-mock"
version = "0.1.0"
description = "Mock VLA task server for experiments"
requires-python = ">=3.12"
dependencies = [
  "cyclopts>=4",
  "fastapi>=0.116",
  "loguru>=0.7",
  "rva-pydantic",
  "rva-vla-schemas",
  "uvicorn>=0.35",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-pydantic = {workspace = true}
rva-vla-schemas = {workspace = true}
