[project]
name = "rva-ui"
version = "0.1.0"
description = "Web page showing a session live: conversation, actions and camera, with typed input"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "pydantic>=2.11",
  "rva-pydantic",
  "rva-schemas",
  "uvicorn>=0.35",
  "websockets>=15",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-pydantic = {workspace = true}
rva-schemas = {workspace = true}
