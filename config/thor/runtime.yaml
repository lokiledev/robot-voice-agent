# Lune on Thor: only what differs from the default profile's runtime.yaml, which this one is laid
# over. A mapping changes the keys it names; a list, a value, a null, or a mapping of another
# `kind`, replaces what is there.
extends: ../default

llm_server:
  # Thor's 128 GB are shared by CPU and GPU: every layer fits on the GPU.
  n_cpu_moe: 0

vision:
  device:
    kind: cuda
  camera:
    source:
      # RealSense D455 colour stream, named by the robot's udev rules; YUYV only, up to 1280x800.
      device: /dev/video-ego-rgb
    # A placeholder until the robot's description is read: ROS names the D455's this way.
    frame: camera_color_optical_frame
    width: 1280
    height: 720
    intrinsics: cameras/d455.yaml  # Assumed from the datasheet, not calibrated yet.
  # Not tried on Thor yet.
  depth: null

# No microphone array on Thor: nothing tells where speech comes from.
doa: null
transforms: []

audio:
  # No sound server on Thor: the USB headset is ALSA's default, through a `plug` PCM in
  # ~/.asoundrc that converts to the mono 16 and 24 kHz streams the code opens.
  input_device: null
  output_device: null
