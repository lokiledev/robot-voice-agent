# `lune-sim`: a Reachy Mini on a table, simulated in Genesis.
namespace: rva  # Same as robot.namespace in runtime.yaml.
description:
  version: 1.14.0
  directory: ~/.cache/robot-voice-agent/reachy_mini
avatars:
  commit: 0943055db6ec570bcef9f2c8b41c9e5467c808f9
  directory: ~/.cache/robot-voice-agent/rocketbox
  blender: /snap/bin/blender
# What happens around the robot: a scenario of rva_robot_sim/scenarios.py, by name, which picks
# its scene (the table and the people) and gives each person a script. `still`: Ana and Ben stand
# in an A-pose. `greeting`: Ana greets the robot and asks it things, Ben listens. `greeting_as_ben`
# and `greeting_as_ana`: you speak for one of them into the microphone. `--scenario` runs another,
# with `lune` or `lune-sim`.
scenario: greeting
speech:
  directory: ~/.cache/robot-voice-agent/speech
  sample_rate: 24000  # Kokoro's.
  # The PipeWire sink of config/pipewire/61-rva-sim-room.conf, whose monitor the agent listens to
  # (audio.input_device in runtime.yaml): the scripted lines, and the live voice if any.
  room: rva_sim_room
  # The scripted lines play here too, for you to hear: the robot's speaker, the reSpeaker, whose
  # echo canceller then keeps them out of your voice as it does the robot's.
  loudspeaker: alsa_output.usb-Seeed_Studio_reSpeaker_XVF3800
  microphone: alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800
  # The reSpeaker hums at about -60 dBFS in a quiet room.
  live_mouth:
    closed_dbfs: -50
    open_dbfs: -25
physics_dt: 0.005
state_rate: 100
camera_fps: 30
# Nyx needs an NVIDIA GPU with ray tracing; `kind: rasterizer` renders anywhere, flat.
camera_renderer:
  kind: nyx
  samples_per_pixel: 16
  environment:
    name: artist_workshop  # Any of polyhaven.com/hdris
    resolution: 2k
    brightness: 1.0
    rotation_deg: 0
    directory: ~/.cache/robot-voice-agent/hdri
