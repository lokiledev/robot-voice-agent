# `lune-sim`: a Reachy Mini on a table, simulated in Genesis.
namespace: rva  # Same as robot.namespace in runtime.yaml.
description:
  version: 1.14.0
  directory: ~/.cache/robot-voice-agent/reachy_mini
# The head camera ends up about 1.25 m above the floor: a seated person's face, a little below a
# standing one's.
table_height: 1.1
avatars:
  commit: 0943055db6ec570bcef9f2c8b41c9e5467c808f9
  directory: ~/.cache/robot-voice-agent/rocketbox
  blender: /snap/bin/blender
# The people around the robot: a scene of rva_robot_sim/scenes.py, by name. `still_pair` stands
# two in an A-pose; `animated_pair`, the same two idling, talking and listening. `lune-sim --scene`
# runs another.
scene: animated_pair
speech:
  directory: ~/.cache/robot-voice-agent/speech
  # The PipeWire sink of config/pipewire/61-rva-sim-room.conf, whose monitor the agent listens to
  # (audio.input_device in runtime.yaml); null to leave the people silent.
  sink: rva_sim_room
physics_dt: 0.005
state_rate: 100
camera_fps: 30
# Nyx needs an NVIDIA GPU with ray tracing; `kind: rasterizer` renders anywhere, flat.
camera_renderer:
  kind: nyx
  samples_per_pixel: 16
  environment:
    name: artist_workshop  # Any of polyhaven.com/hdris
    resolution: 2k
    brightness: 1.0
    rotation_deg: 0
    directory: ~/.cache/robot-voice-agent/hdri
