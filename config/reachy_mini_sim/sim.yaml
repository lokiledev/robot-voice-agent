# `lune-sim`: a Reachy Mini on a table, simulated in Genesis.
namespace: rva  # Same as robot.namespace in runtime.yaml.
description:
  version: 1.14.0
  directory: ~/.cache/robot-voice-agent/reachy_mini
avatars:
  commit: 0943055db6ec570bcef9f2c8b41c9e5467c808f9
  directory: ~/.cache/robot-voice-agent/rocketbox
  blender: /snap/bin/blender
# The rooms of the scenes that have one, downloaded on first use.
interiors:
  directory: ~/.cache/robot-voice-agent/interiors
# What happens around the robot: a scenario of rva_robot_sim/scenarios.py, by name, which picks
# its scene (the table and the people) and gives each person a script. `newcomer`: the robot's
# first day at the front desk; Mia and Ben chat, introduce themselves and cut its welcome
# speech short, then Cleo walks in, a visitor it asks the name of; `newcomer_as_mia`: you speak
# for Mia into the microphone. `greeting`: Mia
# greets the robot and asks it things, Ben listens; `greeting_as_ben` and `greeting_as_mia`: you
# speak for one of them. `still`: Mia and Ben stand in an A-pose. `--scenario` runs another, with
# `lune` or `lune-sim`.
scenario: newcomer
speech:
  directory: ~/.cache/robot-voice-agent/speech
  sample_rate: 24000  # Kokoro's.
  # The PipeWire sink of config/pipewire/61-rva-sim-room.conf, whose monitor the agent listens to
  # (audio.input_device in runtime.yaml): the scripted lines, and the live voice if any.
  room: rva_sim_room
  # The scripted lines play here too, for you to hear: the robot's speaker, the reSpeaker, whose
  # echo canceller then keeps them out of your voice as it does the robot's.
  loudspeaker: alsa_output.usb-Seeed_Studio_reSpeaker_XVF3800
  microphone: alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800
  # The reSpeaker hums at about -60 dBFS in a quiet room.
  live_mouth:
    closed_dbfs: -50
    open_dbfs: -25
# Reachy Mini's Dynamixels, at 5 V, with the P gains Pollen writes to them (hardware_config.yaml;
# I and D are 0): stall torque and no-load speed from ROBOTIS' e-manual. The gearbox's inertia
# and friction are Pollen's MJCF estimates for the XC330 ("would need to re-identify"), scaled by
# the square of the gear ratio and the ratio for the antennas' 77.5:1.
servos:
  - model: XL330-M288-T
    joints: [stewart_1, stewart_2, stewart_3, stewart_4, stewart_5, stewart_6]
    stall_torque_nm: 0.52
    no_load_rpm: 103
    p_gain: 300
    armature: 0.0018
    frictionloss_nm: 0.058
  - model: XC330-M288-T
    joints: [yaw_body]
    stall_torque_nm: 0.93
    no_load_rpm: 81
    p_gain: 200
    armature: 0.0018
    frictionloss_nm: 0.058
  - model: XL330-M077-T
    joints: [right_antenna, left_antenna]
    stall_torque_nm: 0.215
    no_load_rpm: 383
    p_gain: 200
    armature: 0.00013
    frictionloss_nm: 0.016
# The rods' ball joints, which the MJCF gives an actuator's damping and friction (0.15 N m s and
# 0.1 N m on each axis): enough to hold the platform still against 0.52 N m servos. Nearly free.
passive_joints:
  joints: [passive_1, passive_2, passive_3, passive_4, passive_5, passive_6, passive_7]
  frictionloss_nm: 0.002
  armature: 0.0001
physics_dt: 0.005
state_rate: 100
camera_fps: 30
# As often as the reSpeaker gives them to the agent (doa.poll_hz in the default profile):
# its chip updates them every 15 ms, but each USB read takes 15 ms, two per direction.
doa_hz: 20
# Nyx needs an NVIDIA GPU with ray tracing; `kind: rasterizer` renders anywhere, flat.
camera_renderer:
  kind: nyx
  samples_per_pixel: 16
  environment:
    name: artist_workshop  # Any of polyhaven.com/hdris
    resolution: 2k
    brightness: 1.0
    rotation_deg: 0
    directory: ~/.cache/robot-voice-agent/hdri
