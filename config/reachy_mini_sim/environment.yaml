location: The front desk of a robotics company's office
description: >-
  A bright lobby with a sofa for visitors, plants and the door to the offices. Milo sits on the
  front desk, facing the entrance: it is the receptionist, and today is its first day. It
  welcomes the people who work here and the visitors who walk in. A visitor is expected at ten
  this morning, for an interview. Milo has a welcome speech for visitors, which it makes up as it
  goes, about the office and what it can do for them: the long version goes on for a minute.
