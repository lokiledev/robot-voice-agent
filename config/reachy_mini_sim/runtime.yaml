# Milo, a simulated Reachy Mini: only what differs from the default profile's runtime.yaml, which
# this one is laid over. A mapping changes the keys it names; a list, a value, a null, or a
# mapping of another `kind`, replaces what is there.
extends: ../default

# Joints and head camera over kickmsg, of the simulation `lune-sim` runs.
robot:
  namespace: rva  # Same as namespace in sim.yaml.
  connect_timeout_s: 5
  silence_timeout_s: 2

# `lune head`: drives the head to the poses it is sent, e.g. by `lune robot`, and points its
# camera at the gaze targets it is sent: the attention's, by `lune see`, `lune run`...
head_controller:
  description:  # The same as in sim.yaml.
    version: 1.14.0
    directory: ~/.cache/robot-voice-agent/reachy_mini
  max_head_yaw_deg: 30
  # Where the head stays while it looks around, in meters: Pollen's neutral pose.
  gaze_position: [0.0, 0.0, 0.177]
  # About what Pollen's goto moves reach: 30 degrees in its default 0.5 s, minimum jerk, peaks at
  # 112 degrees/s and 690 degrees/s². The servos could go 3 to 5 times as fast; a camera turning
  # that fast loses the faces it tracks.
  motion:
    max_speed_deg_s: 120
    max_acceleration_deg_s2: 600
    max_speed_m_s: 0.05
    max_acceleration_m_s2: 0.5
    settle_s: 0.15
  # With nobody to look at, the head drifts back to looking ahead, slowly.
  recentre_after_s: 3.0
  recentre_speed_deg_s: 20

vision:
  camera:
    # The robot's head camera, over kickmsg.
    source:
      kind: robot
    # A placeholder: the MJCF's camera is `eye_camera`, which looks along -z with +y up, not an
    # optical frame. The robot's description would add the optical link.
    frame: eye_camera_optical
    width: 1280
    height: 720
    intrinsics: cameras/reachy_mini_sim.yaml
  tracker:
    # The head camera's 80 degree field of view makes faces small: 0.06 of the frame is a face
    # about 1.8 m away, as 0.12 is with the C920 of the default profile.
    min_face_height: 0.06
  # The simulation's people, apart from the real ones, in a new database each session: everyone
  # meets Milo anew each run, and the first named becomes its operator.
  database:
    kind: session

attention:
  weights:
    # Whoever speaks draws the head, over the others in view: 3 of the weights' 10.5, where the
    # default profile's 1 of 7.5 often left the head on a listener.
    speaking: 3.0
    raised: 3.0
  # 0.41 and 0.27 of the weights' sum, 10.5, as the default profile's are 0.3 and 0.2 of 7.5.
  margin: 0.039
  min_score: 0.026

# The simulation's own, and best left missing: the ids are those of a face database made anew
# each session.
admins: ~/.config/robot-voice-agent/reachy_mini_sim/admins.yaml

# Direction of arrival: the simulated robot's microphones, in its head at the camera, which hear
# speech from the head of the person speaking (rva_robot_sim.hearing).
doa:
  kind: robot
  frame: head_microphones

# The microphones' frame has x along the camera's view, y to the image's left and z up it: from
# the optical frame (z ahead, x right, y down), as the reSpeaker's would be lying flat facing
# ahead.
transforms:
  - parent: eye_camera_optical
    child: head_microphones
    xyz: [0.0, 0.0, 0.0]
    rpy: [1.5707963, -1.5707963, 0.0]

audio:
  # The simulated room, config/pipewire/61-rva-sim-room.conf: what the simulated people say, with
  # the reSpeaker XVF3800's voice for a live one (`live` in sim.yaml). The reSpeaker cancels the
  # robot's voice on its chip, against what it plays from its own jack, so the robot speaks
  # through it, as in the default profile. Without the room: the reSpeaker's input,
  # alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800.
  input_device: rva_sim_room.monitor

tts:
  # A young man's voice; am_puck, am_liam and am_echo are others.
  voice: am_fenrir
