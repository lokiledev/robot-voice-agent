# The simulated robot's room, for robot-voice-agent's simulation.
#
# `lune-sim` plays what the simulated people say into the "rva_sim_room" sink, and the real
# microphone's voice when it speaks for one of them; the agent listens to its monitor,
# "rva_sim_room.monitor", as it would to a microphone (`audio.input_device` in
# config/reachy_mini_sim/runtime.yaml).
#
# Install: copy to ~/.config/pipewire/pipewire.conf.d/ and run
#   systemctl --user restart pipewire pipewire-pulse wireplumber
context.objects = [
    {   factory = adapter
        args = {
            factory.name = support.null-audio-sink
            node.name = "rva_sim_room"
            node.description = "Simulated room (robot-voice-agent)"
            media.class = Audio/Sink
            audio.position = [ MONO ]
            # Never the default output: only what targets it plays there.
            priority.session = 0
            priority.driver = 0
            monitor.channel-volumes = true
        }
    }
]
