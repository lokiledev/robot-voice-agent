# A real microphone mixed into the simulated room, to talk to the simulated robot along with its
# simulated people. Needs 61-rva-sim-room.conf.
#
# The capture targets the reSpeaker XVF3800 the Reachy profile listens with, which cancels the
# robot's voice on its chip before it is mixed in. Set `target.object` to another source's
# node.name, as `pw-cli ls Node` lists them, for another microphone.
#
# Install: copy to ~/.config/pipewire/pipewire.conf.d/ and run
#   systemctl --user restart pipewire pipewire-pulse wireplumber
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Microphone into the simulated room (robot-voice-agent)"
            audio.position = [ MONO ]
            capture.props = {
                node.name = "rva_sim_room_mic_capture"
                target.object = "alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_101991441262200318-00.analog-stereo"
                # Waits for the microphone rather than falling back to another.
                node.dont-reconnect = true
                node.passive = true
            }
            playback.props = {
                node.name = "rva_sim_room_mic_playback"
                target.object = "rva_sim_room"
                node.dont-reconnect = true
            }
        }
    }
]
