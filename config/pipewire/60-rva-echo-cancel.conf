# Echo cancellation for robot-voice-agent.
#
# The robot plays into "rva_ec_sink" and listens on "rva_ec_source". WebRTC's
# canceller subtracts what goes to the sink from the default microphone, so the
# robot does not hear itself through the speakers and can still be interrupted.
#
# Install: copy to ~/.config/pipewire/pipewire.conf.d/ and run
#   systemctl --user restart pipewire pipewire-pulse wireplumber
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            node.latency = 1024/48000
            capture.props = {
                node.name = "rva_ec_capture"
                node.passive = true
            }
            source.props = {
                node.name = "rva_ec_source"
                node.description = "Robot microphone (echo cancelled)"
            }
            sink.props = {
                node.name = "rva_ec_sink"
                node.description = "Robot speaker (echo cancelled)"
            }
            playback.props = {
                node.name = "rva_ec_playback"
                node.passive = true
            }
        }
    }
]
