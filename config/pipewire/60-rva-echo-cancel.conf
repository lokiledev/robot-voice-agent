# Echo cancellation for robot-voice-agent.
#
# The robot plays into "rva_ec_sink" and listens on "rva_ec_source". WebRTC's
# canceller subtracts what goes to the sink from the microphone, so the robot
# does not hear itself through the speakers and can still be interrupted.
#
# The microphone is the reSpeaker XVF3800 array, pinned by node name so that a
# headset becoming the desktop's default does not change what the robot hears.
# The sink plays to the default output: not the array's own jack, which only
# runs at 16 kHz. Remove `target.object` to follow the default source;
# `wpctl status` and `wpctl inspect <id>` give another device's node name.
#
# Install: copy to ~/.config/pipewire/pipewire.conf.d/ and run
#   systemctl --user restart pipewire pipewire-pulse wireplumber
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            node.latency = 1024/48000
            capture.props = {
                node.name = "rva_ec_capture"
                node.passive = true
                target.object = "alsa_input.usb-Seeed_Studio_reSpeaker_XVF3800_4-Mic_Array_101991441262200318-00.analog-stereo"
            }
            source.props = {
                node.name = "rva_ec_source"
                node.description = "Robot microphone (echo cancelled)"
            }
            sink.props = {
                node.name = "rva_ec_sink"
                node.description = "Robot speaker (echo cancelled)"
            }
            playback.props = {
                node.name = "rva_ec_playback"
                node.passive = true
            }
        }
    }
]
