agent:
  max_history_messages: 60
  max_tool_rounds: 4
  stop_words: [stop, freeze, halt, stop stop, robot stop]
  regreet_after_s: 300

llm:
  base_url: http://127.0.0.1:8080/v1
  model: qwen3.5-35b-a3b
  temperature: 0.7
  max_tokens: 400
  chat_template_kwargs:
    enable_thinking: false

llm_server:
  executable: ~/.local/src/llama.cpp/build/bin/llama-server
  hf_repo: unsloth/Qwen3.5-35B-A3B-GGUF
  hf_file: Qwen3.5-35B-A3B-Q4_K_M.gguf
  host: 127.0.0.1
  port: 8080
  context_size: 16384
  n_cpu_moe: 12
  extra_args: [--flash-attn, "on", --parallel, "1"]

vla:
  base_url: http://127.0.0.1:8800

vision:
  device: cuda
  camera:
    device: /dev/video0  # Logitech HD Pro Webcam C920
    width: 1920
    height: 1080
    fps: 30
  detector:
    model:
      repo: opencv/face_detection_yunet
      file: face_detection_yunet_2023mar.onnx
    score_threshold: 0.8
    nms_threshold: 0.3
  recognizer:
    repo: opencv/face_recognition_sface
    file: face_recognition_sface_2021dec.onnx
  tracker:
    min_face_height: 0.12
    iou_threshold: 0.3
    reid_threshold: 0.5
    confirm_after_s: 0.5
    leave_after_s: 3.0
    embed_every_s: 1.0
    embeddings_per_track: 5
  matching:
    threshold: 0.363
    margin: 0.05
  database: ~/.local/share/robot-voice-agent/faces.sqlite3
  max_embeddings_per_person: 10

observability:
  captures_dir: ~/Captures/robot-voice-agent
