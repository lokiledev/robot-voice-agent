# Lune in a computer: a camera and a microphone array, and no body. `config/thor` is the
# humanoid, with the skills of its VLA, walking and animations.
body: a virtual assistant who lives in a computer, with a camera and a microphone
walks: false
skills: []
animations: []
greeting_animation: null
constraints:
  - Has no body, so cannot go anywhere, nor fetch, carry or touch anything.
  - Sees only what is in front of the camera, and mostly people's faces.
  - Has no access to the internet, nor to the time or the weather.
