[project]
name = "robot-voice-agent"
version = "0.1.0"
description = "Local voice agent for high-level reasoning and user interaction on a humanoid robot"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "rva-app",
  "rva-vla-mock",
]

[dependency-groups]
dev = [
  "deptry>=0.23",
  "hypothesis>=6.130",
  "inline-snapshot>=0.23",
  "pre-commit>=4.6",
  "pytest-asyncio>=1.0",
  "pytest-timeout>=2.4",
  "pytest>=8",
  "ruff>=0.15",
  "ty>=0.0.1",
  # For ty to check the conversion of Light-ASD.
  {include-group = "export"},
]
# PyTorch, to convert Light-ASD to ONNX on first use: `uv sync --group export`.
export = [
  "rva-multimodal[export]",
]

[tool.uv]
package = false
# kokoro-onnx asks for the CPU onnxruntime, which shadows onnxruntime-gpu.
# Both install the same module, so drop the CPU one.
override-dependencies = [
  "onnxruntime; sys_platform == 'never'",
]

[tool.uv.sources]
# PyPI's aarch64 onnxruntime-gpu has no kernels for Jetson Thor's GPU (sm_110). NVIDIA's Jetson AI
# Lab build does, and uses the system's CUDA 13 and cuDNN 9 (apt: cuda-toolkit-13-2, libcudnn9-cuda-13),
# so the packages that use it skip the pip CUDA extras on aarch64.
onnxruntime-gpu = {url = "https://pypi.jetson-ai-lab.io/sbsa/cu130/+f/012/c10bef23a39f0/onnxruntime_gpu-1.24.0-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.12'"}
rva-agent = {workspace = true}
rva-app = {workspace = true}
rva-body-client = {workspace = true}
rva-body-schemas = {workspace = true}
rva-llm = {workspace = true}
rva-multimodal = {workspace = true}
rva-observability = {workspace = true}
rva-pydantic = {workspace = true}
rva-schemas = {workspace = true}
rva-ui = {workspace = true}
rva-vla-client = {workspace = true}
rva-vla-mock = {workspace = true}
rva-vla-schemas = {workspace = true}
rva-vision-faces = {workspace = true}
rva-vision-viewer = {workspace = true}
rva-voice-asr = {workspace = true}
rva-voice-audio = {workspace = true}
rva-voice-tts = {workspace = true}
# Only converts a checkpoint once: the CPU build spares the CUDA libraries.
torch = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = [
  "agent",
  "app",
  "body/client",
  "body/schemas",
  "common/observability",
  "common/pydantic",
  "llm",
  "multimodal",
  "schemas",
  "ui",
  "vla/client",
  "vla/mock",
  "vla/schemas",
  "vision/faces",
  "vision/viewer",
  "voice/asr",
  "voice/audio",
  "voice/tts",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
addopts = "--import-mode=importlib -m 'not download and not audio'"
markers = [
  "cuda: needs an NVIDIA GPU",
  "download: needs model weights (run with -m download)",
  "audio: needs a sound device",
]
