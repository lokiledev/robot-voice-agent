[project]
name = "rva-llm"
version = "0.1.0"
description = "Streaming tool-calling client for an OpenAI-compatible local LLM server"
requires-python = ">=3.12"
dependencies = [
  "loguru>=0.7",
  "openai>=1.100",
  "rva-pydantic",
  "rva-schemas",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-pydantic = {workspace = true}
rva-schemas = {workspace = true}
