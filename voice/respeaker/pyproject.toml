[project]
name = "rva-voice-respeaker"
version = "0.1.0"
description = "The reSpeaker XVF3800 microphone array, asked over USB where it hears speech from"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "loguru>=0.7",
  "pydantic>=2.11",
  "pyusb>=1.2",
  "rva-pydantic",
  "rva-schemas",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-pydantic = {workspace = true}
rva-schemas = {workspace = true}
