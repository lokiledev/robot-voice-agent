[project]
name = "rva-voice-tts"
version = "0.1.0"
description = "Speech synthesis with Kokoro"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "kokoro-onnx>=0.4",
  "numpy>=2.0",
  "onnxruntime-gpu>=1.22; platform_machine == 'aarch64'",
  "onnxruntime-gpu[cuda,cudnn]>=1.22; platform_machine != 'aarch64'",
  "pydantic>=2.11",
  "rva-pydantic",
  "rva-schemas",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-pydantic = {workspace = true}
rva-schemas = {workspace = true}
