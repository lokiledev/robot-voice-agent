[project]
name = "rva-schemas"
version = "0.1.0"
description = "Data model and interfaces shared by the agent, voice and LLM packages"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.11",
  "rva-pydantic",
  "rva-vla-schemas",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-pydantic = {workspace = true}
rva-vla-schemas = {workspace = true}
