[project]
name = "rva-robot-sim"
version = "0.1.0"
description = "Reachy Mini simulated in Genesis, serving its joints and head camera over kickmsg"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "cyclopts>=4",
  "genesis-world>=1.4.6",
  # Nyx renders the head camera; its wheels are for x86-64 only.
  "gs-nyx-plugin>=0.1.10; platform_machine == 'x86_64'",
  "httpx>=0.28",
  "kickmsg>=0.10",
  "loguru>=0.7",
  # Genesis imports matplotlib without declaring it.
  "matplotlib>=3.7",
  "numpy>=2.0",
  "pydantic>=2.11",
  "rva-pydantic",
  "rva-robot-schemas",
  # Genesis imports torch without declaring it, and Nyx needs its CUDA build.
  "torch>=2.8",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-pydantic = {workspace = true}
rva-robot-schemas = {workspace = true}

[project.scripts]
lune-sim = "rva_robot_sim.cli:app"
