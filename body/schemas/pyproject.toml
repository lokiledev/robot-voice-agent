[project]
name = "rva-body-schemas"
version = "0.1.0"
description = "Data model and client interface of the robot body's motions, gestures and gaze"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.11",
  "rva-pydantic",
  "rva-vla-schemas",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-pydantic = {workspace = true}
rva-vla-schemas = {workspace = true}
