[project]
name = "rva-app"
version = "0.1.0"
description = "Command line entry point that composes the agent, voice, LLM, VLA and robot clients"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "cyclopts>=4",
  "dearpygui>=2.3",
  "httpx>=0.28",
  "loguru>=0.7",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "rva-agent",
  "rva-attention",
  "rva-body-client",
  "rva-interaction",
  "rva-llm",
  "rva-multimodal",
  "rva-observability",
  "rva-pydantic",
  "rva-robot-client",
  "rva-robot-schemas",
  "rva-schemas",
  "rva-ui",
  "rva-vla-client",
  "rva-voice-asr",
  "rva-voice-audio",
  "rva-voice-tts",
  "rva-vision-faces",
  "rva-vision-viewer",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-agent = {workspace = true}
rva-attention = {workspace = true}
rva-body-client = {workspace = true}
rva-interaction = {workspace = true}
rva-llm = {workspace = true}
rva-multimodal = {workspace = true}
rva-observability = {workspace = true}
rva-pydantic = {workspace = true}
rva-robot-client = {workspace = true}
rva-robot-schemas = {workspace = true}
rva-schemas = {workspace = true}
rva-ui = {workspace = true}
rva-vla-client = {workspace = true}
rva-voice-asr = {workspace = true}
rva-voice-audio = {workspace = true}
rva-voice-tts = {workspace = true}
rva-vision-faces = {workspace = true}
rva-vision-viewer = {workspace = true}

[project.scripts]
lune = "rva_app.cli:app"
