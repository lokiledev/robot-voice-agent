[project]
name = "rva-vision-viewer"
version = "0.1.0"
description = "Shows the camera as it is processed: the overlay, a Dear PyGui debug window and the RTSP stream; implements Recorder"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "dearpygui>=2.3",
  "numpy>=2.0",
  "opencv-python>=4.10",
  "pydantic>=2.11",
  "rva-pydantic",
  "rva-schemas",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-pydantic = {workspace = true}
rva-schemas = {workspace = true}
