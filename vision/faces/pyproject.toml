[project]
name = "rva-vision-faces"
version = "0.1.0"
description = "Face detection, tracking and recognition, face features and skeletons from the camera; implements Vision"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "huggingface-hub>=0.30",
  "loguru>=0.7",
  "numpy>=2.0",
  "onnx>=1.17",
  "onnxruntime-gpu>=1.22; platform_machine == 'aarch64'",
  "onnxruntime-gpu[cuda,cudnn]>=1.22; platform_machine != 'aarch64'",
  "opencv-python>=4.10",
  "opentelemetry-api>=1.36",
  "rva-pydantic",
  "rva-schemas",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-pydantic = {workspace = true}
rva-schemas = {workspace = true}
