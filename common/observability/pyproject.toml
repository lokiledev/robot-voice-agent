[project]
name = "rva-observability"
version = "0.1.0"
description = "Loguru, OpenTelemetry and rerun setup; records agent events to an rrd file"
requires-python = ">=3.12"
dependencies = [
  "loguru>=0.7",
  "opentelemetry-api>=1.36",
  "opentelemetry-sdk>=1.36",
  "rerun-sdk>=0.24",
  "rva-pydantic",
  "rva-schemas",
]

[build-system]
requires = [
  "uv_build>=0.11,<0.12",
]
build-backend = "uv_build"

[tool.uv.sources]
rva-pydantic = {workspace = true}
rva-schemas = {workspace = true}
